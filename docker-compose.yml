version: "3.9"

services:

  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    container_name: capm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       capm
      POSTGRES_USER:     capm_user
      POSTGRES_PASSWORD: capm_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capm_user -d capm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ──
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capm_api
    restart: unless-stopped
    environment:
      DATABASE_URL:  postgresql://capm_user:cap`m_password_change_me@db:5432/capm
      SECRET_KEY:    change-this-secret-key-in-production
      ENVIRONMENT:   production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ml_models:/app/models

  # ── Nginx (serves frontend + proxies API) ──
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: capm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  ml_models:
